<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рита — лист персонажа</title>
<style>
  html, body { margin: 0; background: #1b1a18; }
  #stage { width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
  #stage svg { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../../shared/timeline.js"></script>
<script src="../../shared/ink.js"></script>
<script src="rita.js"></script>
<script>
// Character sheet: pose A and pose B large on plain paper, for judging the drawing itself.
// renderAt(t) keeps the wind alive, so the sheet can also be rendered as a short loop.
const { C, defs, paper, wash } = DH.ink;
const DURATION = 4;
const stage = document.getElementById('stage');

function renderAt(t) {
  const turn = DH.ease.draw(DH.progress(t, 1.2, 1.8));
  const a = DH.rita.poseA({ t, wind: 0.2, blink: DH.blink(t, 2.6) });
  const b = DH.rita.poseB({ t, wind: 0.2, turn });
  const ground = (x, w) => wash(`M ${x - w} 1040 C ${x - w / 2} 1018 ${x + w / 2} 1016 ${x + w} 1036 C ${x + w / 2} 1056 ${x - w / 2} 1060 ${x - w} 1040 Z`, C.ochreWash, 0.35, 'wcWet');
  stage.innerHTML = `<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${defs}
    <rect width="1920" height="1080" fill="${C.paper}"/>
    ${ground(640, 180)}${ground(1360, 170)}
    <g transform="translate(640 1036) scale(1.45)">${a.svg}</g>
    <g transform="translate(1360 1036) scale(1.8)">${b.svg}</g>
    ${paper}</svg>`;
}

window.renderAt = renderAt;
window.DURATION = DURATION;
if (!new URLSearchParams(location.search).has('render')) {
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  addEventListener('resize', fit); fit();
  renderAt(+(new URLSearchParams(location.search).get('t') || 0.5));
}
</script>
</body>
</html>
