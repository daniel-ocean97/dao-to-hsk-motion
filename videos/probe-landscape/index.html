<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проба: акварельный пейзаж кодом</title>
<style>
  html, body { margin: 0; background: #1b1a18; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: #f5f2ec; }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #paper { mix-blend-mode: multiply; }
  #ui { position: fixed; left: 12px; right: 12px; bottom: 10px; display: flex; gap: 10px; align-items: center;
        font: 14px/1 "Segoe UI", sans-serif; color: #ece6dc; }
  #ui input { flex: 1; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="back" width="1920" height="1080"></canvas><canvas id="front" width="1920" height="1080"></canvas><canvas id="paper" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="play">▶</button><input id="scrub" type="range" min="0" max="6" step="0.01" value="0"><span id="time">0.00</span></div>

<script src="../../shared/timeline.js"></script>
<script src="../../shared/rig.js"></script>
<script src="../../shared/watercolor.js"></script>
<script src="../../characters/rita/rig-art.js"></script>
<script>
// Variant A of the landscape: watercolour painted by code (shared/watercolor.js).
//   0.0-3.0  scene 1, cool morning: mountains in mist, water, rock, pine; Rita pose A
//   3.0-6.0  finale, dawn: the same place in warm light with the sun; Rita pose B
// Each layer is painted once; the camera moves the layers at their depth, mist drifts,
// the water reflection ripples.
const { ease, lerp, progress } = DH;
const W = DH.wc;
const DURATION = 6;
const params = new URLSearchParams(location.search);
const back = document.getElementById('back'), front = document.getElementById('front');
const bctx = back.getContext('2d'), fctx = front.getContext('2d');

const HORIZON = 700;
const X0 = -400, X1 = 2400; // painted width, wider than the frame for camera moves

const PALETTES = {
  morning: {
    skyTop: '#f5f2ec', skyLow: '#e4e6e8', far: ['#aeb6c2', '#8f9aab'], mid: ['#7d8593', '#5b6370'],
    water: '#c3cad2', mist: '#f2f1ee', rock: false,
  },
  dawn: {
    skyTop: '#f3ece6', skyLow: '#efd7d2', far: ['#c6b3b4', '#ab9599'], mid: ['#8c7d84', '#6b5c64'],
    water: '#d6c3c0', mist: '#f6e6e2', rock: true, sun: { x: 900, y: 612, rad: 52 },
  },
};

function farRidge(seed) {
  return W.ridge({ x0: X0, x1: X1, base: 615, jag: 10, seed, peaks: W.peakRow({ x0: X0, x1: X1, hMin: 110, hMax: 290, gap: 320, seed: seed + 50 }) });
}
function midRidge(seed) {
  return W.ridge({ x0: X0, x1: X1, base: 695, jag: 14, seed, peaks: W.peakRow({ x0: X0, x1: X1, hMin: 70, hMax: 250, gap: 380, seed: seed + 60 }) });
}

// Everything that does not change per frame, for one palette.
function paintPlace(pal) {
  const L = {};
  const ox = X0, w = X1 - X0;
  L.far = { c: W.mountains({ w, h: 520, ox, oy: 260, ridge: farRidge(3), color: pal.far[0], under: pal.skyLow, deep: pal.far[1], fadeTo: 700, seed: 3 }), ox, oy: 260, p: 0.25 };
  L.mid = { c: W.mountains({ w, h: 560, ox, oy: 380, ridge: midRidge(5), color: pal.mid[0], under: pal.skyLow, deep: pal.mid[1], fadeTo: 770, ink: 16, inkColor: '#3e3a36', seed: 5 }), ox, oy: 380, p: 0.55 };
  if (pal.sun) L.sun = { ...W.sun(pal.sun), p: 0.15 };

  // water: a pale wash with horizontal streaks
  const wc = W.canvas(w, 520), wx = wc.getContext('2d');
  wx.translate(-ox, -HORIZON);
  W.wash(wx, [[X0, HORIZON, 0.01], [X1, HORIZON, 0.01], [X1, HORIZON + 520, 0.05], [X0, HORIZON + 520, 0.05]], pal.water, { layers: 18, alpha: 0.06, seed: 31 });
  const r = W.rng(32);
  wx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 90; i++) {
    const y = HORIZON + 8 + Math.pow(r(), 1.6) * 400, x = X0 + r() * w, len = 60 + r() * 260;
    W.dryStroke(wx, [[x, y], [x + len * 0.5, y + 1], [x + len, y]], 2 + r() * 4, '#000000', { alpha: 0.5, hairs: 2, dry: 0.5, seed: 40 + i });
  }
  wx.globalCompositeOperation = 'source-over';
  L.water = { c: wc, ox, oy: HORIZON, p: 0.8 };

  // reflection of the mountains, flipped at the horizon, soft
  const rc = W.canvas(w, 360), rx = rc.getContext('2d');
  rx.filter = 'blur(5px)';
  rx.globalAlpha = 0.22;
  for (const k of ['far', 'mid']) {
    // a row at world y lands at (HORIZON - y) * 0.75 below the horizon
    const l = L[k];
    rx.setTransform(1, 0, 0, -0.75, l.ox - ox, 0.75 * (HORIZON - l.oy));
    rx.drawImage(l.c, 0, 0);
  }
  L.reflect = { c: rc, ox, oy: HORIZON, p: 0.8 };

  L.mistFar = { c: W.mistBand({ w: w + 800, h: 120, color: pal.mist, seed: 13 }), ox: ox - 400, oy: 600, p: 0.35, speed: 9 };
  L.mistLow = { c: W.mistBand({ w: w + 800, h: 110, color: pal.mist, seed: 17 }), ox: ox - 400, oy: 655, p: 0.65, speed: -14 };
  return L;
}

// One painted layer placed in world coords (ox, oy) and seen by camera cam at depth p
// (the same maths as DH.ink.layer).
function place(ctx, img, ox, oy, cam, p) {
  const z = 1 + (cam.zoom - 1) * p;
  ctx.setTransform(z, 0, 0, z, 960 + z * (ox - 960 - cam.x * p), 540 + z * (oy - 540 - cam.y * p));
  ctx.drawImage(img, 0, 0);
}

function drawPlace(L, pal, cam, t) {
  const ctx = bctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, 760);
  sky.addColorStop(0, pal.skyTop);
  sky.addColorStop(1, pal.skyLow);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 1920, 1080);
  if (L.sun) place(ctx, L.sun.canvas, L.sun.ox, L.sun.oy + 10 - t * 6, cam, L.sun.p);
  place(ctx, L.far.c, L.far.ox, L.far.oy, cam, L.far.p);
  for (const k of ['mistFar']) { const m = L[k]; place(ctx, m.c, m.ox + ((t * m.speed) % 400), m.oy, cam, m.p); }
  place(ctx, L.mid.c, L.mid.ox, L.mid.oy, cam, L.mid.p);
  place(ctx, L.water.c, L.water.ox, L.water.oy, cam, L.water.p);
  // reflection ripples: thin slices drawn with a small sideways wave
  const R = L.reflect, z = 1 + (cam.zoom - 1) * R.p;
  for (let y = 0; y < R.c.height; y += 4) {
    const dx = Math.sin(y * 0.11 + t * 2.2) * (1 + y * 0.02) + Math.sin(y * 0.031 - t * 1.3) * 2;
    ctx.setTransform(z, 0, 0, z, 960 + z * (R.ox + dx - 960 - cam.x * R.p), 540 + z * (R.oy + y - 540 - cam.y * R.p));
    ctx.drawImage(R.c, 0, y, R.c.width, 4, 0, 0, R.c.width, 4);
  }
  { const m = L.mistLow; place(ctx, m.c, m.ox + ((t * m.speed) % 400 + 400) % 400 - 400, m.oy, cam, m.p); }
  place(ctx, L.rock.canvas, L.rock.ox, L.rock.oy, cam, 1);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

const RITA_A = { x: 1250, y: 1012, h: 675 }, RITA_B = { x: 1420, y: 1012, h: 700 };
let places, rigA, rigB, pine;

function renderAt(t) {
  t = Math.min(Math.max(t, 0), DURATION - 1e-6);
  const dawn = t >= 3, lt = dawn ? t - 3 : t;
  const pal = dawn ? PALETTES.dawn : PALETTES.morning, L = dawn ? places.dawn : places.morning;
  const k = ease.draw(progress(lt, 0, 3));
  const cam = dawn
    ? { x: lerp(-20, 10, k), y: lerp(40, -10, k), zoom: lerp(1.05, 1.0, k) }
    : { x: lerp(-70, 20, k), y: lerp(0, -8, k), zoom: lerp(1.0, 1.06, k) };
  drawPlace(L, pal, cam, t);
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.clearRect(0, 0, 1920, 1080);
  place(fctx, pine.canvas, pine.ox, pine.oy, cam, 1.7);
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  rigA.canvas.style.display = dawn ? 'none' : 'block';
  rigB.canvas.style.display = dawn ? 'block' : 'none';
  if (dawn) rigB.drawAt({ t }, { cam, ...RITA_B });
  else rigA.drawAt({ t }, { cam, ...RITA_A });
}

(async () => {
  const opt = { base: '../../', paper: '#f5f2ec' };
  [rigA, rigB] = await Promise.all([DH.rig.load(DH.ritaArt.a, opt), DH.rig.load(DH.ritaArt.b, opt)]);
  places = { morning: paintPlace(PALETTES.morning), dawn: paintPlace(PALETTES.dawn) };
  places.morning.rock = W.rock({ x: 1250, y: 1012, w: 520, seed: 3 });
  places.dawn.rock = W.rock({ x: 1420, y: 1012, w: 560, seed: 4, dawn: true });
  pine = W.pineBranch({ x: -160, y: -60, scale: 1.2, seed: 5, blur: 4 });
  document.getElementById('paper').getContext('2d').drawImage(W.paperSheet(1920, 1080), 0, 0);
  front.before(rigA.canvas, rigB.canvas);
  window.DURATION = DURATION;
  window.renderAt = renderAt;
  startPreview();
})().catch((e) => {
  document.body.insertAdjacentHTML('afterbegin', `<pre style="color:#f88;font:16px monospace">${e.stack}</pre>`);
  throw e;
});

// Preview UI only: the renderer calls renderAt(t) directly.
function startPreview() {
  if (params.has('render')) { document.body.classList.add('render'); return; }
  const stage = document.getElementById('stage');
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, (innerHeight - 40) / 1080)})`; };
  addEventListener('resize', fit); fit();
  const scrub = document.getElementById('scrub'), label = document.getElementById('time'), btn = document.getElementById('play');
  let playing = false, startClock = 0, startT = 0;
  const show = (t) => { renderAt(t); scrub.value = t; label.textContent = t.toFixed(2); };
  scrub.oninput = () => { playing = false; btn.textContent = '▶'; show(+scrub.value); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '❚❚' : '▶'; startClock = performance.now(); startT = +scrub.value; if (playing) tick(); };
  function tick() { if (!playing) return; show((startT + (performance.now() - startClock) / 1000) % DURATION); requestAnimationFrame(tick); }
  show(+(params.get('t') || 0));
}
</script>
</body>
</html>
