<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проба: места маршрута, анимация</title>
<style>
  html, body { margin: 0; background: #1b1a18; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: #f5f2ec; }
  #stage canvas { position: absolute; left: 0; top: 0; display: block; }
  #paper { mix-blend-mode: multiply; }
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1920" height="1080"></canvas><canvas id="paper" width="1920" height="1080"></canvas></div>

<script src="../../shared/timeline.js"></script>
<script src="../../shared/watercolor.js"></script>
<script src="../../shared/details.js"></script>
<script src="../../shared/caption.js"></script>
<script src="../../shared/preview.js"></script>
<script src="../../shared/location.js"></script>
<script>
// Probe of one place from the library (locations/*.js), 2.5 s: ?place=wall|guilin|shanghai,
// &variant=N for a sketch variant (k.variant). Painting the layers takes a while before the first frame.
const DURATION = 2.5;
const out = document.getElementById('out').getContext('2d');
(async () => {
  const params = new URLSearchParams(location.search);
  const place = params.get('place') || 'wall';
  await DH.location.load([place]);
  const scene = await DH.location.make(place, { variant: params.get('variant') });
  document.getElementById('paper').getContext('2d').drawImage(DH.wc.paperSheet(1920, 1080), 0, 0);
  const renderAt = (t) => scene.frame(out, t);
  window.DURATION = DURATION;
  window.renderAt = renderAt;
  DH.preview(renderAt, DURATION);
})().catch((e) => {
  document.body.insertAdjacentHTML('afterbegin', `<pre style="color:#f88;font:16px monospace">${e.stack}</pre>`);
  throw e;
});
</script>
</body>
</html>
